<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Registration</title>
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

<!-- Custom CSS -->
<style>
body {
	background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
}

.registration-card {
	width: 100%;
	max-width: 500px;
	border: none;
	border-radius: 15px;
	box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
}

.card-header {
	background-color: #0d6efd;
	color: white;
	border-radius: 15px 15px 0 0 !important;
	text-align: center;
	padding: 20px;
}

.form-label {
	font-weight: 600;
	color: #343a40;
}

.form-control {
	border-radius: 8px;
	padding: 10px 12px;
}

.form-control:focus {
	border-color: #0d6efd;
	box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
}

.submit-btn {
	width: 100%;
	padding: 10px;
	border-radius: 8px;
	font-weight: 600;
}
</style>

</head>
<body>
	<div class="container">
		<div class="card registration-card mx-auto">

			<div class="card-header">
				<h2 class="mb-0">Employee Registration</h2>
				<small>Enter employee details</small>
			</div>

			<div class="card-body p-4">

				<form action="register" method="post">

					<!-- Name -->
					<div class="mb-3">
						<label for="name" class="form-label">Name</label> <input
							type="text" id="name" name="name" class="form-control"
							placeholder="Enter employee name" required>
					</div>

					<!-- Age -->
					<div class="mb-3">
						<label for="age" class="form-label">Age</label> <input
							type="number" id="age" name="age" class="form-control"
							placeholder="Enter age" min="18" required>
					</div>

					<!-- City -->
					<div class="mb-3">
						<label for="city" class="form-label">City</label> <input
							type="text" id="city" name="city" class="form-control"
							placeholder="Enter city" required>
					</div>

					<!-- Salary -->
					<div class="mb-4">
						<label for="salary" class="form-label">Salary</label> <input
							type="number" id="salary" name="salary" class="form-control"
							placeholder="Enter salary" min="0" required>
					</div>

					<!-- Submit -->
					<button type="submit" class="btn btn-primary submit-btn">
						Register Employee</button>

				</form>

			</div>
		</div>
	</div>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
		
	</script>

</body>
</html>
