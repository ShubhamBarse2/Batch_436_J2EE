<!DOCTYPE html>
<html>
<head>

<style>
body {
	font-family: Arial, sans-serif;
	background-color: #f2f2f2;
	text-align: center;
}

.container {
	width: 500px;
	margin: 150px auto;
	padding: 40px;
	background-color: white;
	border-radius: 10px;
	box-shadow: 0 0 10px #ccc;
}

h1 {
	color: #333;
}

p {
	color: #666;
	margin-bottom: 30px;
}

a {
	display: inline-block;
	padding: 12px 25px;
	margin: 10px;

	text-decoration: none;
	border-radius: 5px;
}

.register {
	background-color: #28a745;
}

.register:hover {
	background-color: #218838;
}

.login {
	background-color: #007bff;
}

.login:hover {
	background-color: #0056b3;
}
</style>
</head>

<body>

	<div class="container">

		<h1>Employee Management System</h1>

		<p>Welcome to the Employee Management System</p>

		<a href="register.html" class="register"> Register </a> <a
			href="login.html" class="login"> Login </a>

	</div>

</body>
</html>
